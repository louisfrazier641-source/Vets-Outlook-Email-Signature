<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VETS LLC Email Signature</title>
</head>
<body>
<div style="font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #000000;">
    <div style="margin: 0; padding: 0;">
        <p style="margin: 0; padding: 0; font-weight: bold; font-size: 12pt;">{DisplayName}</p>
        <p style="margin: 0; padding: 0; font-style: italic; font-size: 11pt;">{JobTitle} | VETS LLC.</p>
        <p style="margin: 0; padding: 0; font-size: 11pt;">Email: <a href="mailto:{Email}" style="color: #0563C1; text-decoration: none;">{Email}</a></p>
        <p style="margin: 0; padding: 0; font-size: 11pt;">Cell: {MobilePhone}</p>
        <p style="margin: 0; padding: 0; font-size: 11pt;">Website: <a href="http://www.vetsmbse.com" style="color: #0563C1; text-decoration: none;">vetsmbse.com</a></p>
        
        <p style="margin: 6pt 0 0 0; padding: 0; font-weight: bold; font-size: 11pt;">Headquarters:</p>
        <p style="margin: 0; padding: 0; font-size: 11pt;">140 Research Blvd.</p>
        <p style="margin: 0; padding: 0; font-size: 11pt;">Madison, Alabama 35758</p>
        
        <!-- Logos Row -->
        <div style="margin-top: 12px; display: table; border-spacing: 8px;">
            <!-- VETS Logo -->
            <img src="cid:VETSlogo" alt="VETS Logo" style="width: 50px; height: auto; border: none;" />
            
            <!-- DoD SkillBridge Logo -->
            <img src="cid:DoDSkillBridge" alt="DoD SkillBridge" style="width: 50px; height: auto; border: none;" />
            
            <!-- Service-Disabled Veteran-Owned Logo -->
            <img src="cid:ServiceDisabledVeteran" alt="Service-Disabled Veteran-Owned Certified" style="width: 50px; height: auto; border: none;" />
            
            <!-- WordPress Logo -->
            <img src="cid:WordPress" alt="WordPress" style="width: 50px; height: auto; border: none;" />
        </div>
    </div>
</div>
</body>
</html>
