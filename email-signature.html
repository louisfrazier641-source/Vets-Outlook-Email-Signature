<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif;">
    <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; background-color: #ffffff;">
        <tr>
            <td style="padding: 20px; border-left: 4px solid #0052CC;">
                <!-- Company Logo/Header -->
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-bottom: 15px;">
                    <tr>
                        <td style="padding-bottom: 10px;">
                            <img src="https://github.com/louisfrazier641-source/Vets-Outlook-Email-Signature/raw/main/VETSlogo.png.png" alt="VETS Logo" style="height: 50px; width: auto; display: block;">
                        </td>
                    </tr>
                </table>

                <!-- Contact Information -->
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-bottom: 15px;">
                    <tr>
                        <td>
                            <p style="margin: 0 0 5px 0; font-size: 14px; font-weight: bold; color: #000000;">Your Name</p>
                            <p style="margin: 0 0 3px 0; font-size: 12px; color: #333333;">Your Title</p>
                            <p style="margin: 0 0 10px 0; font-size: 12px; color: #666666;">Company Name</p>
                        </td>
                    </tr>
                </table>

                <!-- Contact Details -->
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; font-size: 11px; margin-bottom: 15px;">
                    <tr>
                        <td style="padding: 3px 0; color: #333333;">
                            <span style="font-weight: bold;">Phone:</span> (555) 123-4567
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 3px 0; color: #333333;">
                            <span style="font-weight: bold;">Email:</span> <a href="mailto:your.email@company.com" style="color: #0052CC; text-decoration: none;">your.email@company.com</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 3px 0; color: #333333;">
                            <span style="font-weight: bold;">Address:</span> 123 Business Ave, City, State 12345
                        </td>
                    </tr>
                </table>

                <!-- Certifications/Badges -->
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                    <tr>
                        <td style="padding-right: 10px;">
                            <img src="https://github.com/louisfrazier641-source/Vets-Outlook-Email-Signature/raw/main/DoD%20SkillBridge.png" alt="DoD SkillBridge" style="height: 40px; width: auto; display: block;">
                        </td>
                        <td style="padding-right: 10px;">
                            <img src="https://github.com/louisfrazier641-source/Vets-Outlook-Email-Signature/raw/main/Service-Disabled-Veteran-Owned-Certified.png" alt="Service Disabled Veteran Owned" style="height: 40px; width: auto; display: block;">
                        </td>
                        <td>
                            <img src="https://github.com/louisfrazier641-source/Vets-Outlook-Email-Signature/raw/main/Wordpress-resized-7.png" alt="Company Badge" style="height: 40px; width: auto; display: block;">
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- Disclaimer (optional) -->
    <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px;">
        <tr>
            <td style="padding: 15px 20px; font-size: 9px; color: #999999; border-top: 1px solid #cccccc; margin-top: 15px;">
                <p style="margin: 0;">This email and any attachments are confidential and may be legally privileged.</p>
            </td>
        </tr>
    </table>
</body>
</html>
